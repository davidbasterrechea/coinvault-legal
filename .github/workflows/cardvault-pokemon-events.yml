name: CardVault Pokemon Events

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sync Pokemon events from PokeData
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          CARDVAULT_EVENT_SYNC_TOKEN: ${{ secrets.CARDVAULT_EVENT_SYNC_TOKEN }}
          CARDVAULT_EVENT_DEBUG: "0"
        run: node sync_CARDVAULT_12.9.49_POKEDATA.mjs
