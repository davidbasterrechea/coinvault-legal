name: CardVault Pokemon Events
on:
  workflow_dispatch:
  schedule:
  - cron: "17 * * * *"
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: tools/CardVaultPokemonEventCollector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/CardVaultPokemonEventCollector/package.json
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Sync official Pokemon events
        run: npm run sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          CARDVAULT_EVENT_SYNC_TOKEN: ${{ secrets.CARDVAULT_EVENT_SYNC_TOKEN }}
